# One service only. Confirm the Free plan in Render before applying.
services:
  - type: web
    name: alberta-stays
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run db:generate && npm run typecheck && npm test && npm run build
    # Run migrations only when storage is explicitly activated; fail startup on
    # migration errors. Database credentials are configured as dashboard secrets.
    startCommand: >-
      if [ "$ENABLE_LISTING_STORAGE" = "true" ]; then npm run db:migrate; fi && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
