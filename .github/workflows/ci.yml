name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  staging-rehearsal:
    name: Staging rehearsal (production build)
    needs: [validate, database]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run test:deployment
  database:
    name: PostgreSQL migrations and ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alberta_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: alberta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alberta_test -d alberta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alberta_test:local-test-only@localhost:5432/alberta_test
      DIRECT_URL: postgresql://alberta_test:local-test-only@localhost:5432/alberta_test
      TEST_DATABASE_URL: postgresql://alberta_test:local-test-only@localhost:5432/alberta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Verify migration repeatability
        run: npm run db:migrate
      - run: npm run test:db
